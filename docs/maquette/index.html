<meta charset="utf-8">
<title>Maquette SchoolHub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Readex+Pro:wght@500;600&display=swap">
<style>
/* Mise en page : une fenêtre d'application. Menu à gauche, recherche du guichet toujours en haut,
   une colonne de travail au centre. En vue téléphone, le menu devient des onglets en bas. */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --sunk:#E8EEF3; --ink:#13202C; --ink-2:#4A5B6B; --ink-3:#6F8091;
  --line:#D7DFE6; --line-2:#B7C4CF;
  --accent:#1B5DA4; --accent-soft:#E1ECF8; --accent-ink:#0E3D70; --on-accent:#FFFFFF;
  --ok:#2C7A30; --ok-soft:#E2F1DF; --warn:#B25E00; --warn-soft:#FCEED7; --bad:#BF3328; --bad-soft:#F9E3E0;
  --paper:#FFFFFF; --paper-ink:#1B1B1B; --paper-line:#BDBDBD; --paper-head:#F2F2F2;
  --wa-bg:#EFEAE2; --wa:#D9FDD3; --wa-ink:#111B21;
  --proto:#1A1D22; --proto-2:#30353D; --proto-ink:#F2F4F6;
  --shadow:0 12px 32px rgba(16,36,56,.16);
  --font-display:"Readex Pro","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --surface:#151F29; --sunk:#1C2834; --ink:#E4ECF2; --ink-2:#A6B5C2; --ink-3:#8494A3;
    --line:#283644; --line-2:#3A4B5B;
    --accent:#6FA9EA; --accent-soft:#17314C; --accent-ink:#BBD8F7; --on-accent:#0A1A2B;
    --ok:#73C677; --ok-soft:#15301C; --warn:#F2A54A; --warn-soft:#3A2911; --bad:#F07A70; --bad-soft:#3E1C19;
    --wa-bg:#0B141A; --wa:#005C4B; --wa-ink:#E9EDEF;
    --proto:#EEF1F4; --proto-2:#D3DAE1; --proto-ink:#13202C;
    --shadow:0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#151F29; --sunk:#1C2834; --ink:#E4ECF2; --ink-2:#A6B5C2; --ink-3:#8494A3;
  --line:#283644; --line-2:#3A4B5B;
  --accent:#6FA9EA; --accent-soft:#17314C; --accent-ink:#BBD8F7; --on-accent:#0A1A2B;
  --ok:#73C677; --ok-soft:#15301C; --warn:#F2A54A; --warn-soft:#3A2911; --bad:#F07A70; --bad-soft:#3E1C19;
  --wa-bg:#0B141A; --wa:#005C4B; --wa-ink:#E9EDEF;
  --proto:#EEF1F4; --proto-2:#D3DAE1; --proto-ink:#13202C;
  --shadow:0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
table{font:inherit;color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.lucide{width:18px;height:18px;flex:none;stroke-width:1.8}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* Bandeau d'accueil de la maquette */
.intro{max-width:1240px;margin:0 auto 14px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink)}
.intro p{margin:0;max-width:90ch}
.intro b{font-weight:600}
.intro .x{margin-left:auto;background:none;border:0;color:inherit;cursor:pointer;padding:2px;border-radius:6px;display:grid}

/* Fenêtre de l'application */
.app{container:app/inline-size;max-width:1240px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:680px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.02em}
.bt{display:grid;line-height:1.15}
.bt b{font-family:var(--font-display);font-weight:600;font-size:15px}
.bt small{color:var(--ink-2);font-size:12px}
.search{flex:1;max-width:540px;position:relative;display:flex;align-items:center}
.search > svg{position:absolute;left:11px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line-2);border-radius:10px;background:var(--sunk);color:var(--ink);font:inherit}
.search input:focus{background:var(--surface)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);z-index:30;overflow:hidden}
.results .row{padding:9px 12px}
.results .hint{padding:10px 12px;color:var(--ink-2);font-size:13px}
.who{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.user{display:flex;align-items:center;gap:8px;color:var(--ink)}
.av{width:30px;height:30px;border-radius:50%;background:var(--sunk);border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.un{display:grid;line-height:1.15;font-weight:500}
.un small{font-weight:400;color:var(--ink-2);font-size:12px}
.rail{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.railh{margin:14px 10px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);color:var(--ink-2);background:none;border:0;width:100%;text-align:left;cursor:pointer}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.nav .count{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;text-align:center;line-height:18px}
.main{padding:22px 26px 36px;min-width:0}
.tabbar{display:none;border-top:1px solid var(--line);background:var(--surface);justify-content:space-around;padding:6px 4px}
.tab{display:grid;justify-items:center;gap:2px;background:none;border:0;font-size:11px;color:var(--ink-3);padding:4px 10px;cursor:pointer;border-radius:8px}
.tab[aria-current="page"]{color:var(--accent)}

/* Éléments communs */
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;margin-bottom:18px}
.h1{font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--ink-2);margin:3px 0 0}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--ink-3);margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.wide{width:100%}
.btn.sm{padding:4px 9px;font-size:13px}
.lnk{background:none;border:0;padding:0;color:var(--ink);font-weight:500;cursor:pointer;text-align:left}
.lnk:hover{color:var(--accent);text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.6}
.pill svg.lucide{width:13px;height:13px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent-ink)}
.pill.muted{background:var(--sunk);color:var(--ink-2)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--ok);display:inline-block}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.dot.due{background:transparent;border:2.5px solid var(--accent)}
.dot.none{background:transparent;border:1.5px dashed var(--line-2)}
.t-ok{color:var(--ok)} .t-warn{color:var(--warn)} .t-bad{color:var(--bad)} .t-due{color:var(--accent)} .t-mute{color:var(--ink-3)}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ch h2{font-family:var(--font-display);font-size:15px;font-weight:600;margin:0}
.ch p{margin:0;color:var(--ink-2);font-size:13px}
.cb{padding:14px 16px}
.cf{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-width:0}
button.row{width:100%;background:none;border:0;text-align:left;cursor:pointer}
button.row:hover{background:var(--sunk)}
.rows > :not(:first-child){border-top:1px solid var(--line)}
.grow{flex:1;min-width:0}
.two{display:grid;line-height:1.3;min-width:0}
.two small{color:var(--ink-2);font-size:12.5px}
.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols.prof{grid-template-columns:230px minmax(0,1fr)}
.stack{display:grid;gap:16px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:20px}
.stat{display:grid;gap:2px;text-align:left;background:var(--sunk);border:1px solid transparent;border-radius:12px;padding:12px 14px;min-width:0}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--line-2)}
.stat .k{font-size:12.5px;color:var(--ink-2)}
.stat .v{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;font-weight:500;color:var(--ink-2)}
.stat .h{font-size:12px;color:var(--ink-3)}
.stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--bad)} .stat.ok .v{color:var(--ok)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--sunk);color:var(--ink-2);font-size:13px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.off{color:var(--ink-3);border-style:dashed}
.seg2{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;padding:2px;background:var(--sunk)}
.seg2 button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.section-t{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 10px}
input[type="checkbox"],input[type="radio"]{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.empty{padding:18px 16px;color:var(--ink-2)}

/* Formulaires */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.f{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}
.f.full{grid-column:1/-1}
.f .opt{font-weight:400;color:var(--ink-3)}
.f input,.f select,.f textarea,.inp{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 10px;width:100%}
.f input[aria-invalid="true"],.f select[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:12px;font-weight:500}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:400;cursor:pointer}

/* Accueil : séances du jour */
.srow{display:grid;grid-template-columns:58px minmax(0,1fr) auto 18px;align-items:center;gap:12px;padding:12px 16px}
.srow .time{font-family:var(--font-mono);font-size:13px;line-height:1.25;color:var(--ink)}
.srow .time small{color:var(--ink-3)}
.srow .smeta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.srow.now{background:var(--accent-soft)}
.srow > svg{color:var(--ink-3)}

/* Professeurs */
.plist{display:grid;gap:4px}
.pbtn{display:grid;text-align:left;padding:9px 12px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;line-height:1.3}
.pbtn small{color:var(--ink-2);font-size:12.5px}
.pbtn:hover{background:var(--sunk)}
.pbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-soft)}
.pbtn[aria-pressed="true"] b{color:var(--accent-ink)}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gcard{display:grid;gap:6px;align-content:start;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;min-width:0}
.gcard:hover{border-color:var(--line-2);background:var(--sunk)}
.gcard b{font-family:var(--font-display);font-weight:600;font-size:15.5px;line-height:1.25}
.gcard small{color:var(--ink-2);font-size:12.5px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gfoot{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:12.5px;margin-top:4px}
.gfoot svg.lucide{width:15px;height:15px}

/* Fiche groupe et appel */
.schips{display:flex;gap:6px;flex-wrap:wrap}
.schip{display:grid;gap:1px;padding:7px 11px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;font-size:13px;line-height:1.25;min-width:96px}
.schip small{font-size:11.5px;color:var(--ink-3)}
.schip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.schip .st-ok{color:var(--ok)} .schip .st-todo{color:var(--warn)} .schip .st-now{color:var(--accent)}
.arow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 16px}
.arow .two small{font-size:12.5px}
.abs{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line-2);border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2);user-select:none;background:var(--surface)}
.abs input{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1.5px solid var(--line-2);border-radius:4px;display:grid;place-content:center;background:var(--surface)}
.abs input:checked{background:var(--bad);border-color:var(--bad)}
.abs input:checked::after{content:"✕";font-size:10px;line-height:1;font-weight:600;color:var(--surface)}
.abs:has(input:checked){background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pres{font-size:13px;color:var(--ink-3)}
.legend{display:grid;gap:7px;font-size:13px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-weight:500}
.menu{display:grid;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;min-width:250px}
.menu button{background:none;border:0;text-align:left;padding:9px 14px;cursor:pointer}
.menu button:hover{background:var(--sunk)}
.menuwrap{position:relative}
.menuwrap .menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20}

/* Papier : feuille d'appel et reçu */
.paperwrap{overflow-x:auto;padding:4px 2px 14px}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.10);padding:34px 38px;min-width:660px;max-width:820px;margin:0 auto;font-size:13px}
.paper .ph{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}
.paper h3{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0}
.paper .pm{color:#555;margin:2px 0 0}
.ft{border-collapse:collapse;width:100%}
.ft th,.ft td{border:1px solid var(--paper-line);padding:7px 8px;text-align:left}
.ft th{background:var(--paper-head);font-weight:600;font-size:12px}
.ft td.c{width:62px}
.ft tr.blank td{height:30px}
.ft .grp td{background:var(--paper-head);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.paper .pf{display:flex;justify-content:space-between;gap:20px;margin-top:16px;color:#555;font-size:12px}
.recuwrap{overflow-x:auto;padding:4px 2px 12px}
.recu{position:relative;display:grid;grid-template-columns:118px minmax(0,1fr);max-width:560px;min-width:400px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px rgba(0,0,0,.10);font-size:13px;overflow:hidden}
.souche{border-right:2px dashed var(--paper-line);padding:18px 12px;display:grid;align-content:start;gap:10px;background:var(--paper-head)}
.souche .lbl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:#666}
.souche .val{font-family:var(--font-mono);font-size:13px}
.rbody{padding:20px 22px}
.rhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--paper-line);padding-bottom:10px;margin-bottom:12px}
.rhead h3{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0}
.rhead small{color:#555;display:block}
.rno{font-family:var(--font-mono);font-size:15px;font-weight:500;text-align:right}
.rkv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-bottom:12px}
.rkv dt{color:#555}
.rkv dd{margin:0}
.rl{width:100%;border-collapse:collapse;margin-bottom:10px}
.rl td{padding:5px 0;border-bottom:1px dotted var(--paper-line)}
.rl td:last-child{text-align:right;font-family:var(--font-mono)}
.rtot{display:flex;justify-content:space-between;font-weight:600;font-size:15px;padding-top:4px}
.rtot span:last-child{font-family:var(--font-mono)}
.rfoot{margin-top:12px;color:#555;font-size:11.5px}

    ${statBox("Demandes d'inscription", nd, '', nd ? 'Envoyées depuis le lien public' : 'Aucune en attente', '', 'data-go="demandes"')}
    ${statBox('Bibliothèque', here, `/ ${CENTRE.bibCap}`, `${BIB.length} entrées depuis ce matin`, '', 'data-go="bibliotheque"')}
  </div>
  <div class="cols">
    <section class="card" aria-labelledby="t-seances">
      <div class="ch"><h2 id="t-seances">Séances du jour</h2><p>${todays.length} séances · ${sum(todays, g => insOf(g.id).length)} élèves attendus</p></div>
      <div class="rows">${todays.map(g => {
        const [k, t] = sessStatus(g);
        return `<button class="row srow ${k === 'info' ? 'now' : ''}" data-go="groupe" data-g="${g.id}" data-si="${g.c}">
          <span class="time">${g.h1}<br><small>${g.h2}</small></span>
          <span class="two"><b>${g.mat} · ${gniv(g)}</b><small>${PROFS[g.p].nom} · ${gname(g)} · ${insOf(g.id).length} élèves</small></span>
          <span class="smeta">${payBadge(g)}${pill(k, t)}</span>${ic('chevron-right')}</button>`;
      }).join('')}</div>
    </section>
    <div class="stack">
      <section class="card" id="appels" aria-labelledby="t-appels">
        <div class="ch"><h2 id="t-appels">Appels à recopier</h2>${late.length ? pill('warn', late.length) : ''}</div>
        <div class="rows">${late.length ? late.map(g => `<button class="row" data-go="groupe" data-g="${g.id}" data-si="${g.c}">
          <span class="two grow"><b>${dlab(sdate(g, g.c))} · ${g.h1} → ${g.h2}</b><small>${g.mat} · ${gniv(g)} · ${PROFS[g.p].nom}</small></span><span class="btn sm">Recopier</span></button>`).join('') : '<p class="empty">Toutes les feuilles sont saisies.</p>'}</div>
      </section>
      <section class="card" aria-labelledby="t-rouge">
        <div class="ch"><h2 id="t-rouge">Élèves en rouge</h2><p>2 séances de retard ou plus</p></div>
        <div class="rows">${reds.slice(0, 6).map(e => `<button class="row" data-go="eleve" data-e="${e.id}"><span class="dot bad"></span><span class="two grow"><b>${fullname(e)}</b><small>${insOfE(e.id).map(i => G[i.g].mat).join(', ')}</small></span><span class="num t-bad">${fmt(dueTotal(e.id))} TND</span></button>`).join('')}
        ${reds.length > 6 ? `<button class="row" data-go="eleves"><span class="grow t-mute">et ${reds.length - 6} autres élèves</span>${ic('chevron-right')}</button>` : ''}</div>
      </section>
    </div>
  </div>`;
}

/* ----- 2. Professeurs ----- */
function vProfs() {
  const pr = PROFS[S.prof];
  const gsP = Object.values(G).filter(g => g.p === S.prof).sort((a, b) => dayOrder(a.w) - dayOrder(b.w) || parseH(a.h1) - parseH(b.h1));
  const days = [['Tous', 'Tous'], [1, 'Lun'], [2, 'Mar'], [3, 'Mer'], [4, 'Jeu'], [5, 'Ven'], [6, 'Sam'], [0, 'Dim']];
  const shown = gsP.filter(g => S.jour === 'Tous' || g.w === +S.jour);
  const next = g => {
    if (g.w === 6 && NOW < parseH(g.h2)) return `aujourd'hui à ${g.h1}`;
    const i = g.w === 6 || APPEL[g.id + ':' + g.c] || g.w !== 6 ? g.c + 1 : g.c;
    return `${dlab(sdate(g, i))} à ${g.h1}`;
  };
  return head('Professeurs', `${Object.keys(PROFS).length} professeurs · ${Object.keys(G).length} groupes`, `<button class="btn" data-act="todo" data-t="Ajouter un professeur">${ic('plus')}Ajouter un professeur</button>`) + `
  <div class="cols prof">
    <div class="plist" role="group" aria-label="Professeurs">${Object.entries(PROFS).map(([k, p]) => `<button class="pbtn" data-act="prof" data-v="${k}" aria-pressed="${k === S.prof}"><b>${p.nom}</b><small>${p.mat} · ${Object.values(G).filter(g => g.p === k).length} groupes</small></button>`).join('')}</div>
    <div class="stack">
      <div class="pagehead" style="margin:0"><div><h2 class="section-t" style="margin:0;font-size:19px">${pr.nom}</h2><p class="sub">${pr.mat} · ${pr.tel}${S.role === 'own' ? ` · part du centre ${pr.pct} %` : ''}</p></div></div>
      <div class="chips" role="group" aria-label="Filtrer par jour">${days.map(([v, l]) => { const has = v === 'Tous' || gsP.some(g => g.w === v); return `<button class="chip ${has ? '' : 'off'}" data-act="jour" data-v="${v}" aria-pressed="${String(S.jour) === String(v)}">${l}</button>`; }).join('')}</div>
      <div class="gcards">${shown.length ? shown.map(g => `<button class="gcard" data-go="groupe" data-g="${g.id}">
        <span class="gtop"><span class="tag">${g.type}</span>${payBadge(g)}</span>
        <b>${gname(g)}</b>
        <small>${gniv(g)} · ${insOf(g.id).length} / ${g.cap} élèves${insOf(g.id).length >= g.cap ? ' · complet' : ''}</small>
        <span class="gfoot">${ic('clock')}Prochaine séance : ${next(g)}</span></button>`).join('') : `<p class="empty" style="padding:0">Pas de groupe le ${JOURS[+S.jour].toLowerCase()} pour ${pr.nom}.</p>`}</div>
    </div>
  </div>`;
}

/* ----- 3. Fiche groupe ----- */
function vGroupe() {
  const g = G[S.g], pr = PROFS[g.p], ins = insOf(g.id);
  const si = S.si ?? g.c;
  const key = g.id + ':' + si, ap = APPEL[key], future = si > g.c;
  const editing = !future && (!ap || S.edit === key);
  if (!S.absDraft[key]) S.absDraft[key] = new Set(ap ? ap.abs : []);
  const draft = S.absDraft[key];
  const ratt = RATT[key] || [];
  const isEtude = g.type === 'Étude';
  const m = moisOf(si);
  const idxs = isEtude ? [1, 2, 3, 4].map(k => (m - 1) * 4 + k) : Array.from({ length: g.nb }, (_, k) => k + 1);
  const chipSt = k => APPEL[g.id + ':' + k] ? ['st-ok', 'appel fait'] : k > g.c ? ['', 'à venir'] : (k === g.c && g.w === 6) ? ['st-now', "aujourd'hui"] : ['st-todo', 'appel à faire'];
  const counts = { ok: 0, due: 0, warn: 0, bad: 0 }; ins.forEach(i => counts[etat(i)]++);
  const nAbs = draft.size;
  const sessLabel = `${dlab(sdate(g, si))} · ${isEtude ? `séance ${si - (m - 1) * 4} du Mois ${m}` : `séance ${si} sur ${g.nb}`}`;
  const prixTxt = g.type === 'Étude' ? `${g.prix} TND par Mois` : g.type === 'Révision' ? `${g.prix} TND les ${g.nb} séances, ou ${fmt(g.prix / g.nb)} TND la séance` : `${g.prix} TND, en une fois ou en 3 tranches`;
  const absents = ap ? ap.abs : [];
  const parentMsg = eid => `Bonjour, ${E[eid].prenom} ${E[eid].nom} était absent(e) aujourd'hui, ${dlong(sdate(g, si))}, au cours de ${g.mat.toLowerCase()} de ${g.h1} à ${g.h2}.\n${CENTRE.nom}, ${CENTRE.tel}`;
  return head(gname(g), `${g.mat} · ${gniv(g)} · ${pr.nom} · ${g.type}, ${prixTxt}`,
    `<button class="btn" data-go="feuille" data-g="${g.id}">${ic('printer')}Feuille d'appel</button>
     <span class="menuwrap"><button class="btn" data-act="menuSeance" aria-expanded="${S.menuSeance}">${ic('calendar')}Séance</button>${S.menuSeance ? `<span class="menu">${['Annuler cette séance', 'Déplacer cette séance', 'Ajouter une séance supplémentaire', "Changer l'horaire du groupe"].map(t => `<button data-act="todo" data-t="${t}">${t}</button>`).join('')}</span>` : ''}</span>
     <button class="btn primary" data-go="encaissement" data-g="${g.id}">${ic('banknote')}Encaisser${isEtude ? ` le Mois ${gm(g)}` : ''}</button>`,
    crumb('professeurs', 'Professeurs', `data-prof="${g.p}"`) + crumb('professeurs', pr.nom, `data-prof="${g.p}"`) + `<span>${gname(g)}</span>`) + `
  <div class="cols">
    <div class="stack">
      <div class="schips" role="group" aria-label="Séances">${isEtude && m > 1 ? `<button class="schip" data-act="si" data-v="${(m - 2) * 4 + 1}">‹ Mois ${m - 1}<small>séances ${(m - 2) * 4 + 1} à ${(m - 1) * 4}</small></button>` : ''}
        ${idxs.map(k => { const [c, t] = chipSt(k); return `<button class="schip" data-act="si" data-v="${k}" aria-pressed="${k === si}"><b>${dlab(sdate(g, k))}</b><small class="${c}">${t}</small></button>`; }).join('')}
        ${isEtude && m <= gm(g) ? `<button class="schip" data-act="si" data-v="${m * 4 + 1}">Mois ${m + 1} ›<small>à venir</small></button>` : ''}</div>
      <section class="card" aria-labelledby="t-appel">
        <div class="ch"><div><h2 id="t-appel">Appel · ${sessLabel}</h2><p>${future ? 'Séance à venir.' : editing ? 'Tous les élèves sont présents par défaut : cochez seulement les absents.' : `Fait par ${ap.par} à ${ap.heure.replace(':', 'h')}.`}</p></div>
          ${future ? pill('muted', 'À venir') : ap && !editing ? pill('ok', 'Appel fait', 'check') : pill('warn', 'Appel à faire')}</div>
        <div class="rows">${ins.filter(i => i.start <= si).map(i => {
          const st = etat(i), e = E[i.e];
          return `<div class="arow"><span class="dot ${st}" title="${ST_LABEL[st]}"></span>
            <span class="two"><button class="lnk" data-go="eleve" data-e="${e.id}">${fullname(e)}</button><small class="t-${st === 'ok' ? 'mute' : st}">${stateText(i)}${i.prix !== null ? ' · prix spécial' : ''}</small></span>
            ${future ? '' : editing ? `<label class="abs"><input type="checkbox" id="abs-${e.id}" data-act="abs" data-k="${key}" data-e="${e.id}" ${draft.has(e.id) ? 'checked' : ''}>Absent</label>` : absents.includes(e.id) ? pill('bad', 'Absent') : '<span class="pres">Présent</span>'}</div>`;
        }).join('')}
        ${ratt.length ? `<div class="row" style="background:var(--sunk);padding-block:7px"><span class="tag">En rattrapage dans ce groupe</span></div>` + ratt.map(r => `<div class="arow"><span class="dot none" title="Paie dans son groupe d'origine"></span><span class="two"><button class="lnk" data-go="eleve" data-e="${r.e}">${fullname(E[r.e])}</button><small>Vient du ${gname(G[r.from])} · paie dans son groupe</small></span>${future ? '' : editing ? `<label class="abs"><input type="checkbox" id="abs-${r.e}" data-act="abs" data-k="${key}" data-e="${r.e}" ${draft.has(r.e) ? 'checked' : ''}>Absent</label>` : absents.includes(r.e) ? pill('bad', 'Absent') : '<span class="pres">Présent</span>'}</div>`).join('') : ''}
        </div>
        ${future ? '' : `<div class="cf"><span class="t-mute">${ins.filter(i => i.start <= si).length + ratt.length - (editing ? nAbs : absents.length)} présents · ${editing ? nAbs : absents.length} absent${(editing ? nAbs : absents.length) > 1 ? 's' : ''}</span>
          <span class="actions"><button class="btn ghost" data-act="todo" data-t="Ajouter un élève en rattrapage">${ic('plus')}Rattrapage</button>${editing ? `<button class="btn primary" data-act="valider" data-k="${key}">${ic('check')}Valider l'appel</button>` : `<button class="btn" data-act="corriger" data-k="${key}">Corriger l'appel</button>`}</span></div>`}
      </section>
      ${S.appelMsg === key && absents.length ? `<section class="card" aria-labelledby="t-wa"><div class="ch"><h2 id="t-wa">Prévenir les parents des absents</h2><p>Messages WhatsApp prêts, à envoyer depuis le téléphone du centre</p></div><div class="cb stack">
        ${absents.map(eid => `<div class="wachat"><div class="wa">${esc(parentMsg(eid))}<span class="wt">${hh(CLOCK)}</span></div><div class="wameta"><span>À ${E[eid].telP ? `parent de ${fullname(E[eid])} · ${E[eid].telP}` : `${fullname(E[eid])} · ${E[eid].telE}`}</span><button class="btn sm" data-act="wa">${ic('message-circle')}Ouvrir WhatsApp</button></div></div>`).join('')}
      </div></section>` : ''}
    </div>
    <div class="stack">
      <section class="card" aria-labelledby="t-pay">
        <div class="ch"><h2 id="t-pay">Paiements${isEtude ? ` du Mois ${gm(g)}` : ''}</h2>${payBadge(g)}</div>
        <div class="cb stack" style="gap:12px">
          <div class="legend">
            <span><span class="dot"></span>À jour<b class="num" style="margin-left:auto">${counts.ok}</b></span>
            <span><span class="dot due"></span>À payer aujourd'hui<b class="num" style="margin-left:auto">${counts.due}</b></span>
            <span><span class="dot warn"></span>1 séance de retard<b class="num" style="margin-left:auto">${counts.warn}</b></span>
            <span><span class="dot bad"></span>2 séances de retard ou plus<b class="num" style="margin-left:auto">${counts.bad}</b></span>
          </div>
          <p class="t-mute" style="margin:0;font-size:12.5px">Une somme due à une séance passe en orange à la séance suivante, puis en rouge à celle d'après.</p>
          <button class="btn primary wide" data-go="encaissement" data-g="${g.id}">${ic('banknote')}Encaissement groupé</button>
        </div>
      </section>
      <section class="card" aria-labelledby="t-info"><div class="ch"><h2 id="t-info">Le groupe</h2></div><div class="cb">
        <dl class="kv"><dt>Professeur</dt><dd>${pr.nom}</dd><dt>Horaire</dt><dd>${JOURS[g.w]}, ${g.h1} → ${g.h2}</dd><dt>Type</dt><dd>${g.type}</dd><dt>Prix</dt><dd>${prixTxt}</dd><dt>Élèves</dt><dd>${ins.length} / ${g.cap}</dd>${isEtude ? `<dt>Mois en cours</dt><dd>Mois ${gm(g)}, séance ${gs(g)} sur 4</dd>` : `<dt>Avancement</dt><dd>séance ${g.c} sur ${g.nb}</dd>`}</dl>
      </div></section>
    </div>
  </div>`;
}

/* ----- 4. Feuille d'appel ----- */
function vFeuille() {
  const g = G[S.g], m = gm(g), pr = PROFS[g.p];
  const idxs = S.feuille === 'jour' ? [g.c] : g.type === 'Étude' ? [1, 2, 3, 4].map(k => (m - 1) * 4 + k) : Array.from({ length: Math.min(4, g.nb - g.c + 1) }, (_, k) => g.c + k);
  const ins = insOf(g.id);
  return head("Feuille d'appel", `${gname(g)} · ${g.mat} · ${gniv(g)}`,
    `<span class="seg2" role="group" aria-label="Période"><button data-act="feuille" data-v="mois" aria-pressed="${S.feuille !== 'jour'}">${g.type === 'Étude' ? `Mois ${m} (4 séances)` : '4 séances'}</button><button data-act="feuille" data-v="jour" aria-pressed="${S.feuille === 'jour'}">Séance du jour</button></span>
     <button class="btn primary" data-act="todo" data-t="Imprimer la feuille d'appel">${ic('printer')}Imprimer</button>`,
    crumb('professeurs', 'Professeurs', `data-prof="${g.p}"`) + crumb('groupe', gname(g), `data-g="${g.id}"`) + `<span>Feuille d'appel</span>`) + `
  <p class="note" style="margin:0 0 14px">${ic('info')}<span>La feuille ne montre ni téléphone ni paiement. Le professeur peut la remplir, puis la secrétaire recopie l'appel dans SchoolHub.</span></p>
  <div class="paperwrap"><article class="paper" aria-label="Aperçu de la feuille d'appel">
    <div class="ph"><div><h3>${CENTRE.nom}</h3><p class="pm">Feuille d'appel · année 2026-2027</p></div><div style="text-align:right"><b>${gname(g)}</b><p class="pm">${g.mat} · ${gniv(g)}<br>Professeur : ${pr.nom}${g.type === 'Étude' && S.feuille !== 'jour' ? `<br>Mois ${m}` : ''}</p></div></div>
    <table class="ft"><thead><tr><th style="width:34px">N°</th><th>Nom</th><th>Prénom</th>${idxs.map(k => `<th class="c">${dlab(sdate(g, k))}</th>`).join('')}<th style="width:120px">Signature</th></tr></thead>
    <tbody>${ins.map((i, n) => `<tr><td>${n + 1}</td><td>${esc(E[i.e].nom)}</td><td>${esc(E[i.e].prenom)}</td>${idxs.map(() => '<td class="c"></td>').join('')}<td></td></tr>`).join('')}
    <tr class="grp"><td colspan="${4 + idxs.length}">Élèves en rattrapage</td></tr>
    ${[1, 2, 3].map(() => `<tr class="blank"><td></td><td></td><td></td>${idxs.map(() => '<td class="c"></td>').join('')}<td></td></tr>`).join('')}</tbody></table>
    <div class="pf"><span>Écrivez A dans la case d'un élève absent. Les autres sont présents.</span><span>Imprimée le 31/10/2026 par ${me().nom}</span></div>
  </article></div>`;
}

/* ----- 5. Encaissement groupé ----- */
function vEnc() {
  const g = G[S.g];
  if (S.encDone) {
    const rs = S.encDone.map(no => R.find(r => r.no === no));
    return head(`${rs.length} reçu${rs.length > 1 ? 's' : ''} créé${rs.length > 1 ? 's' : ''}`, `${gname(g)} · ${fmt(sum(rs, r => r.total))} TND encaissés en espèces`,
      `<button class="btn" data-act="todo" data-t="Imprimer tous les reçus">${ic('printer')}Imprimer les ${rs.length} reçus</button><button class="btn primary" data-go="groupe" data-g="${g.id}">Retour au groupe</button>`,
      crumb('groupe', gname(g), `data-g="${g.id}"`) + '<span>Encaissement groupé</span>') + `
    <section class="card"><div class="ch"><h2>Un reçu par élève</h2><p>L'email part tout seul quand l'élève en a un, avec copie au centre.</p></div>
    <div class="rows">${rs.map(r => `<div class="row" style="flex-wrap:wrap"><span class="num" style="min-width:64px">n° ${r.no}</span><span class="two grow"><b>${fullname(E[r.e])}</b><small>${r.lines.map(l => l.label).join(' + ')}</small></span><span class="num">${fmt(r.total)} TND</span>
      ${E[r.e].email ? pill('ok', 'Email envoyé', 'mail') : pill('muted', "Pas d'email")}
      <span class="actions"><button class="btn sm" data-act="todo" data-t="Imprimer le reçu">${ic('printer')}Imprimer</button><button class="btn sm" data-go="recu" data-r="${r.no}" data-remise="whatsapp">${ic('message-circle')}WhatsApp</button><button class="btn sm ghost" data-go="recu" data-r="${r.no}">Voir</button></span></div>`).join('')}</div></section>`;
  }
  const ins = insOf(g.id).filter(i => duesNow(i).length);
  const okIns = insOf(g.id).filter(i => !duesNow(i).length);
  if (!S.encSel) S.encSel = new Set();
  const sel = ins.filter(i => S.encSel.has(i.id));
  const tot = sum(sel, i => sum(duesNow(i), d => d.montant));
  return head('Encaissement groupé', `${gname(g)} · ${g.mat} · ${g.type === 'Étude' ? `Mois ${gm(g)}, ${g.prix} TND par élève` : g.type}`, '',
    crumb('professeurs', 'Professeurs', `data-prof="${g.p}"`) + crumb('groupe', gname(g), `data-g="${g.id}"`) + '<span>Encaissement groupé</span>') + `
  <div class="cols">
    <section class="card" aria-labelledby="t-enc">
      <div class="ch"><div><h2 id="t-enc">Qui paie maintenant ?</h2><p>Cochez les élèves qui paient. Chacun paie tout ce qu'il doit dans ce groupe et reçoit son propre reçu.</p></div>
        <button class="btn sm" data-act="encall">${sel.length === ins.length ? 'Tout décocher' : 'Tout cocher'}</button></div>
      <div class="rows">${ins.length ? ins.map(i => { const d = duesNow(i), st = etat(i); return `<label class="row" style="cursor:pointer"><input type="checkbox" id="enc-${i.id}" data-act="encsel" data-i="${i.id}" ${S.encSel.has(i.id) ? 'checked' : ''}><span class="dot ${st}" title="${ST_LABEL[st]}"></span><span class="two grow"><b>${fullname(E[i.e])}</b><small>${d.map(x => x.label).join(' + ')}</small></span><span class="num">${fmt(sum(d, x => x.montant))} TND</span></label>`; }).join('') : '<p class="empty">Tous les élèves du groupe sont à jour.</p>'}</div>
      <div class="cf"><span><b class="num">${sel.length}</b> élève${sel.length > 1 ? 's' : ''} · <b class="num">${fmt(tot)} TND</b></span><button class="btn primary" data-act="encgo" ${sel.length ? '' : 'aria-disabled="true"'}>${ic('receipt')}Encaisser et créer ${sel.length || ''} reçu${sel.length > 1 ? 's' : ''}</button></div>
    </section>
    <section class="card"><div class="ch"><h2>Déjà à jour</h2><p>${okIns.length} élèves</p></div>
      <div class="cb" style="color:var(--ink-2);font-size:13px;line-height:1.7">${okIns.map(i => fullname(E[i.e])).join(', ') || 'Personne pour le moment.'}</div></section>
  </div>`;
}

/* ----- 6. Reçu ----- */
function recuPaper(r) {
  const e = E[r.e];
  const g0 = r.lines.find(l => l.g);
  return `<div class="recuwrap"><article class="recu" aria-label="Aperçu du reçu n° ${r.no}">
    <div class="souche"><span><span class="lbl">Souche</span></span><span><span class="lbl">N°</span><br><span class="val">${r.no}</span></span><span><span class="lbl">Date</span><br><span class="val">${r.date.slice(0, 5)}</span></span><span><span class="lbl">Élève</span><br>${fullname(e)}</span><span><span class="lbl">Montant</span><br><span class="val">${fmt3(r.total)}</span></span></div>
    <div class="rbody">
      <div class="rhead"><div><h3>${CENTRE.nom}</h3><small>${CENTRE.adresse} · ${CENTRE.tel}</small></div><div class="rno">Reçu<br>n° ${r.no}</div></div>

const waRecu = r => { const e = E[r.e], g0 = r.lines.find(l => l.g); return `${CENTRE.nom}\nReçu n° ${r.no} du ${r.date}\n\nÉlève : ${e.prenom} ${e.nom}${g0 ? `\nGroupe : ${gline(g0)} (${PROFS[G[g0.g].p].nom})` : ''}\nPayé : ${r.lines.map(l => l.label).join(', ')}\nMontant : ${fmt3(r.total)} TND, en espèces\n\nReçu par ${r.par}. Merci.`; };
function vRecu() {

        <div class="cf"><span><b class="num">${fmt(tot)} TND</b> en espèces</span><button class="btn primary" data-act="paye" ${chosen.length ? '' : 'aria-disabled="true"'}>${ic('receipt')}${chosen.length ? `Encaisser ${fmt(tot)} TND` : 'Cochez ce qui est payé'}</button></div>
      </section>
      <section class="card" aria-labelledby="t-ins"><div class="ch"><h2 id="t-ins">Inscriptions</h2><button class="btn sm" data-act="todo" data-t="Inscrire dans un autre groupe">${ic('plus')}Inscrire dans un groupe</button></div>

      <section class="card" aria-labelledby="t-rc"><div class="ch"><h2 id="t-rc">Reçus</h2><p>${recus.length}</p></div><div class="rows">

}

/* ----- 9. Formulaire public ----- */
function matsFor(niv) {
  if (!niv) return [];
  const gsN = Object.values(G).filter(g => niv === ADULTE ? g.type === 'Formation' : (g.niv === niv || g.type === 'Formation'));
  const out = {}; gsN.forEach(g => (out[g.mat] = out[g.mat] || []).push(g));
  return Object.entries(out).map(([mat, groups]) => ({ mat, groups }));
}
function vPublic() {

/* ----- 10. Demandes d'inscription ----- */
function qrSvg() {
  let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; let h = '';
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const inF = (fx, fy) => x >= fx && x < fx + 7 && y >= fy && y < fy + 7;
    const fin = (fx, fy) => { const dx = x - fx, dy = y - fy; return dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4); };
    let k; if (inF(0, 0)) k = fin(0, 0); else if (inF(14, 0)) k = fin(14, 0); else if (inF(0, 14)) k = fin(0, 14); else if (x === 7 || y === 7 || (x === 13 && y < 8) || (y === 13 && x < 8)) k = false; else k = r() < .48;
    h += `<i class="${k ? 'k' : ''}"></i>`;
  }
  return `<div class="qr" role="img" aria-label="QR code du formulaire (exemple)">${h}</div>`;
}

/* ----- 12. Parts des professeurs ----- */
function partsRows() {
  const rows = [];
  Object.keys(PROFS).forEach(p => {
    const pr = PROFS[p];
    let av = sum(AVANCES.filter(a => a.p === p && !a.sur), a => a.montant);
    Object.values(G).filter(g => g.p === p).sort((a, b) => dayOrder(a.w) - dayOrder(b.w)).forEach(g => {
      if (g.type === 'Étude') {
        const M = sum(insOf(g.id).filter(i => i.start <= 4), prixEff);
        const centre = M * pr.pct / 100, prof = M - centre, key = g.id + ':M1', paid = !!PARTS[key];
        let ded = 0;
        if (paid) ded = sum(AVANCES.filter(a => a.sur === key), a => a.montant);
        else if (av > 0) { ded = Math.min(av, prof); av -= ded; }
        rows.push({ p, g, key, per: `Mois 1 · fini le ${dmy(sdate(g, 4))}`, M, centre, prof, ded, verser: prof - ded, paid, ready: true });
        rows.push({ p, g, per: `Mois ${gm(g)} en cours · séance ${gs(g)} sur 4`, ready: false });
      } else rows.push({ p, g, per: `${g.type} : à la fin du groupe · séance ${g.c} sur ${g.nb}`, ready: false });
    });
  });
  return rows;
}
function vParts() {

  <section class="card"><div class="scroll-x"><table class="t"><thead><tr><th>Groupe</th><th>Période</th><th class="r">Montant du groupe</th><th class="r">Part du centre</th><th class="r">Avance déduite</th><th class="r">À verser</th><th>Payée</th></tr></thead>

    ? `<tr><td>${gname(r.g)}<br><small class="t-mute">${gniv(r.g)}</small></td><td>${r.per}</td><td class="r num">${fmt(r.M)}</td><td class="r num">${fmt(r.centre)}</td><td class="r num">${r.ded ? '−' + fmt(r.ded) : '—'}</td><td class="r num"><b>${fmt(r.verser)}</b></td><td><label class="check"><input type="checkbox" id="part-${r.key}" data-act="part" data-v="${r.key}" data-d="${r.ded}" ${r.paid ? 'checked' : ''}>${r.paid ? 'Payée' : 'Non payée'}</label></td></tr>`
    : `<tr class="mut"><td>${gname(r.g)}</td><td colspan="6">${r.per}</td></tr>`).join('')).join('')}</tbody></table></div></section>

/* ----- 13. Tableau de bord ----- */
function dash(per) {
  const inP = off => per === 'annee' || off >= -30;
  const enc = { 'Étude': 0, 'Révision': 0, 'Formation': 0, 'Bibliothèque': per === 'annee' ? BIBH.sep + BIBH.oct : BIBH.oct, 'Assurance': 0 };
  const byG = {};
  R.filter(r => !r.annule && inP(r.off)).forEach(r => r.lines.forEach(l => {
    if (l.key && l.key.endsWith(':A')) enc['Assurance'] += l.montant;
    else if (l.key === 'BIB') enc['Bibliothèque'] += l.montant;
    else if (l.g) { enc[G[l.g].type] += l.montant; byG[l.g] = (byG[l.g] || 0) + l.montant; }
  }));
  const rows = Object.values(G).sort((a, b) => a.p.localeCompare(b.p) || dayOrder(a.w) - dayOrder(b.w)).map(g => {
    const imp = sum(insOf(g.id).flatMap(duesNow).filter(d => !d.key.endsWith(':A')), d => d.montant);
    if (g.type !== 'Étude') return { g, M: null, enc: byG[g.id] || 0, imp, pp: null, pc: null };
    const M = sum(insOf(g.id).filter(i => i.start <= 4), prixEff), pc = M * PROFS[g.p].pct / 100;
    return { g, M, enc: byG[g.id] || 0, imp, pp: M - pc, pc };
  });
  const parts = sum(rows, r => r.pp || 0);
  const sal = per === 'annee' ? 4200 : 2100, ach = per === 'annee' ? 852 : 312;
  const encT = sum(Object.values(enc)), dep = parts + sal + ach;
  const impA = sum(Object.values(I).flatMap(duesNow).filter(d => d.key.endsWith(':A')), d => d.montant);
  return { enc, rows, parts, sal, ach, encT, dep, ben: encT - dep, imp: sum(rows, r => r.imp) + impA, impA };
}

function render(toTop) {
  const app = $('#app');
  const m0 = app.querySelector('.main, .public');
  const st = toTop ? 0 : (m0 ? m0.scrollTop : 0);
  const fid = document.activeElement && document.activeElement.id;
  $('#stage').classList.toggle('phone', S.view === 'tel');
  app.innerHTML = S.screen === 'inscription' ? vPublic() : shell();
  const m = app.querySelector('.main, .public');
  if (m) m.scrollTop = st;
  if (toTop) { const top = app.getBoundingClientRect().top + window.scrollY - 12; if (window.scrollY > top) window.scrollTo(0, top); }
  if (fid && !toTop) { const el = document.getElementById(fid); if (el) el.focus({ preventScroll: true }); }

}
function syncProto() {
  document.querySelectorAll('[data-role]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.role === S.role)));
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
  const sel = $('#pscreen');
  sel.value = PSCREENS.some(p => p[0] === S.screen) ? S.screen : '';
}
function go(screen, p = {}) {
  if (!SCREENS[screen]) return;
  if (SCREENS[screen].own && S.role !== 'own') { S.role = 'own'; toast('Écran réservé au propriétaire : la maquette passe en rôle Propriétaire.'); }
  if (screen !== S.screen || p.e || p.g || p.r) Object.assign(S, { sel: null, encSel: null, encDone: null, annul: '', annulErr: false, menuSeance: false, spForm: null, avForm: null, appelMsg: null, edit: null, dDone: null, refus: false, bibExt: null, remise: 'whatsapp', formSent: screen === 'inscription' ? null : S.formSent });
  if (p.si === undefined && (screen === 'groupe') && p.g && p.g !== S.g) S.si = null;
  Object.assign(S, p);
  if (screen === 'groupe' && p.g && p.si === undefined) S.si = null;
  S.screen = screen;
  try { history.replaceState(null, '', '#' + screen); } catch (e) { /* aperçu sans historique */ }
  render(true);
}

  ellist: () => { const b = $('#ellist'); if (b) { b.innerHTML = elRows(); if (window.lucide) lucide.createIcons(); } },
};

document.addEventListener('click', ev => {
  const a = ev.target.closest('[data-act]');
  if (a && a.tagName !== 'INPUT') { if (a.getAttribute('aria-disabled') === 'true' && a.dataset.act !== 'encgo' && a.dataset.act !== 'paye') return; ACT[a.dataset.act] && ACT[a.dataset.act](a, ev); return; }
  const r = ev.target.closest('[data-role]');
  if (r) { S.role = r.dataset.role; if (SCREENS[S.screen].own && S.role !== 'own') { S.screen = 'aujourdhui'; } S.sel = null; render(); return; }
  const v = ev.target.closest('[data-view]');
  if (v) { S.view = v.dataset.view; render(true); return; }
  const g = ev.target.closest('[data-go]');
  if (g) { const { go: scr, ...rest } = g.dataset; if (rest.si !== undefined) rest.si = +rest.si; go(scr, rest); }
  if (!ev.target.closest('.search')) { const b = $('#results'); if (b) b.hidden = true; }
  if (S.menuSeance && !ev.target.closest('.menuwrap')) { S.menuSeance = false; render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'pscreen') { const p = PSCREENS.find(x => x[0] === t.value); if (p) go(p[0], Object.assign({}, p[2])); return; }
  if (t.dataset.bind) { setPath(t.dataset.bind, t.type === 'checkbox' ? t.checked : t.value); if (t.hasAttribute('data-rerender')) render(); return; }
  if (t.dataset.act && ACT[t.dataset.act]) ACT[t.dataset.act](t, ev);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { showResults(); return; }
  if (t.dataset.bind && t.type !== 'checkbox' && t.tagName !== 'SELECT') { setPath(t.dataset.bind, t.value); if (t.dataset.live && LIVE[t.dataset.live]) LIVE[t.dataset.live](); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { const b = $('#results'); if (b) b.hidden = true; if (S.menuSeance) { S.menuSeance = false; render(); } }
  if (ev.key === 'Enter' && ev.target.id === 'q') { const first = document.querySelector('#results [data-go]'); if (first) first.click(); }
});

$('#pscreen').innerHTML = PSCREENS.map(([k, l]) => `<option value="${k}">${l}</option>`).join('') + '<option value="" hidden>Autre écran</option>';
(() => { const h = (location.hash || '').slice(1); if (SCREENS[h]) { S.screen = h; if (SCREENS[h].own) S.role = 'own'; } })();
render();
window.addEventListener('load', () => { if (window.lucide) lucide.createIcons(); });
</script>
