<form class="card carte" [formGroup]="formulaire" (ngSubmit)="enregistrer()" novalidate>
  <h2 class="titre">L'élève</h2>
  <div class="champs">
    <label class="f">
      Prénom
      <input formControlName="prenom" autocomplete="off" />
    </label>
    <label class="f">
      Nom
      <input formControlName="nom" autocomplete="off" />
    </label>
    <label class="f">
      Niveau
      <select class="inp" formControlName="niveauId">
        <option value="">Choisissez le niveau</option>
        @for (niveau of niveaux(); track niveau.id) {
          <option [value]="niveau.id">{{ niveau.nom }}</option>
        }
      </select>
    </label>
    <label class="f">
      Établissement scolaire <span class="opt">(facultatif)</span>
      <input formControlName="etablissement" autocomplete="off" />
    </label>
    <label class="f">
      Téléphone de l'élève
      @if (!propresContacts()) {
        <span class="opt">(facultatif avant la 7ᵉ année)</span>
      }
      <input formControlName="telephoneEleve" inputmode="tel" autocomplete="off" placeholder="22 345 678" />
    </label>
    <label class="f">
      Email de l'élève
      @if (!propresContacts()) {
        <span class="opt">(facultatif avant la 7ᵉ année)</span>
      }
      <input type="email" formControlName="emailEleve" inputmode="email" autocomplete="off" />
    </label>
  </div>

  <h2 class="titre">Le parent</h2>
  <label class="case">
    <input type="checkbox" formControlName="majeur" />
    L'élève est majeur
  </label>
  <div class="champs">
    <label class="f">
      Téléphone WhatsApp du parent
      @if (majeur()) {
        <span class="opt">(facultatif pour un élève majeur)</span>
      }
      <input formControlName="telephoneParent" inputmode="tel" autocomplete="off" placeholder="98 123 456" />
    </label>
    <label class="f">
      Email du parent <span class="opt">(facultatif)</span>
      <input type="email" formControlName="emailParent" inputmode="email" autocomplete="off" />
    </label>
  </div>

  <div class="actions">
    <button type="button" class="btn" [disabled]="envoi()" (click)="annule.emit()">Annuler</button>
    <button type="submit" class="btn primary" [disabled]="!charge() || envoi()">Enregistrer</button>
  </div>

  @if (erreur(); as erreur) {
    <p class="note bad" role="alert">{{ erreur }}</p>
  }
</form>
