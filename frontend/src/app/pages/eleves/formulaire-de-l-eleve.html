<form class="card carte" [formGroup]="formulaire" (ngSubmit)="enregistrer()" novalidate>
  <h2 class="titre">L'élève</h2>
  <sh-brouillon-repris [brouillon]="brouillon" texte="Vous reprenez la fiche que vous aviez commencée." (recommence)="remplir()" />
  <div class="champs">
    <label class="f">
      Prénom
      <input formControlName="prenom" autocomplete="off" />
    </label>
    <label class="f">
      Nom
      <input formControlName="nom" autocomplete="off" />
    </label>
    <label class="f">
      Niveau
      <select class="inp" formControlName="niveauId">
        <option value="">Choisissez le niveau</option>
        @for (niveau of niveaux(); track niveau.id) {
          <option [value]="niveau.id">{{ niveau.nom }}</option>
        }
      </select>
    </label>
    <label class="f">
      <span>Établissement scolaire <span class="opt">(facultatif)</span></span>
      <input formControlName="etablissement" autocomplete="off" />
    </label>
    <label class="f">
      <span>
        Téléphone de l'élève
        @if (!propresContacts()) {
          <span class="opt">(facultatif avant la 7ᵉ année)</span>
        }
      </span>
      <input formControlName="telephoneEleve" inputmode="tel" autocomplete="off" placeholder="22 345 678" />
    </label>
    <label class="f">
      <span>
        Email de l'élève
        @if (!propresContacts()) {
          <span class="opt">(facultatif avant la 7ᵉ année)</span>
        }
      </span>
      <input type="email" formControlName="emailEleve" inputmode="email" autocomplete="off" />
    </label>
  </div>

  <h2 class="titre">Le parent</h2>
  <label class="case">
    <input type="checkbox" formControlName="majeur" />
    L'élève est majeur
  </label>
  <div class="champs">
    <label class="f">
      <span>
        Téléphone WhatsApp du parent
        @if (majeur()) {
          <span class="opt">(facultatif pour un élève majeur)</span>
        }
      </span>
      <input formControlName="telephoneParent" inputmode="tel" autocomplete="off" placeholder="98 123 456" />
    </label>
    <label class="f">
      <span>Email du parent <span class="opt">(facultatif)</span></span>
      <input type="email" formControlName="emailParent" inputmode="email" autocomplete="off" />
    </label>
  </div>

  @if (proposerUnGroupe()) {
    <h2 class="titre">Son groupe</h2>
    <div class="champs">
      <label class="f">
        <span>Professeur <span class="opt">(facultatif)</span></span>
        <select class="inp" formControlName="professeurId">
          <option value="">Pas encore de groupe</option>
          @for (professeur of professeurs(); track professeur.id) {
            <option [value]="professeur.id">{{ nomComplet(professeur) }}</option>
          }
        </select>
      </label>
      @if (professeurChoisi()) {
        <label class="f">
          Groupe
          <select class="inp" formControlName="groupeId">
            <option value="">Choisissez le groupe</option>
            @for (section of sectionsDeGroupes(); track section.titre) {
              <optgroup [label]="section.titre">
                @for (groupe of section.groupes; track groupe.id) {
                  <option [value]="groupe.id">{{ libelleDuGroupe(groupe) }}</option>
                }
              </optgroup>
            }
          </select>
        </label>
      }
      @if (ficheDuGroupe()) {
        @if (modes().length > 0) {
          <label class="f">
            Mode de tarification
            <select class="inp" formControlName="mode">
              <option value="">Choisissez le mode</option>
              @for (mode of modes(); track mode.mode) {
                <option [value]="mode.mode">{{ mode.libelle }}</option>
              }
            </select>
          </label>
        }
        <label class="f">
          Première séance
          <select class="inp" formControlName="debutLe">
            @for (date of dates(); track date.date) {
              <option [value]="date.date">{{ date.libelle }}</option>
            }
          </select>
        </label>
      }
    </div>
    @if (ficheDuGroupe()) {
      <p class="aide">« Enregistrer » crée la fiche et inscrit l'élève dans ce groupe.</p>
    }
  }

  <div class="actions">
    <button type="button" class="btn" [disabled]="envoi()" (click)="annuler()">Annuler</button>
    <button type="submit" class="btn primary" [disabled]="!charge() || envoi()">Enregistrer</button>
  </div>

  @if (erreur(); as erreur) {
    <p class="note bad" role="alert">{{ erreur }}</p>
  }
</form>
